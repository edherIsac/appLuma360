name: cabina360_v2_2
description: "App de grabación y compartición de videos para Cabina 360."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  path_provider: ^2.1.5
  permission_handler: ^11.3.1
  ffmpeg_kit_flutter_new: ^3.2.0
  camera: ^0.11.0+2
  device_info_plus: ^11.2.0
  http: ^1.2.2
  socket_io_client: ^2.0.3+1
  http_parser: ^4.1.0
  file_picker: ^8.1.7
  shared_preferences: ^2.3.4
  wifi_iot: ^0.3.19
  shelf: ^1.4.2
  shelf_static: ^1.1.3
  connectivity_plus: ^6.1.4
  wifi_scan: ^0.4.1
  network_info_plus: ^6.1.3
  qr_flutter: ^4.1.0
  wakelock_plus: ^1.2.8
  share_plus: ^10.1.4
  url_launcher: ^6.3.1
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  assets:
    - assets/logos/
    - assets/audio/
    - assets/js/qrcode.min.js
    - assets/icon/app_icon.png
    - assets/presets/

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
